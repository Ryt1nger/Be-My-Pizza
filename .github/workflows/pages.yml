name: Publish iPhone demo to gh-pages branch
on:
  push:
    branches: [main]
    paths:
      - 'apps/customer/**'
      - 'demo/**'
      - '.github/workflows/pages.yml'
      - 'package.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gh-pages-snapshot
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify catalog and types
        run: |
          npm run test:catalog
          npm run typecheck
      - name: Build mobile SPA for GitHub Pages subpath
        env:
          VITE_PUBLIC_BASE: /Be-My-Pizza/app/
          VITE_DEMO_PAGES: 'true'
        run: npm run build
      - name: Assemble live iPhone device preview
        run: |
          mkdir -p site-dist/app
          cp -R apps/customer/dist/. site-dist/app/
          cp demo/index.html site-dist/index.html
          touch site-dist/.nojekyll
          test -f site-dist/index.html
          test -f site-dist/app/index.html
          test -f site-dist/app/media/brand/logo.webp
          test -f site-dist/app/media/catalog-preview.webp
      - name: Publish preview snapshot to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site-dist
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
